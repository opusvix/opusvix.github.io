  pt:
    titulo: "LogiTrack: SQL Analytics"
    alt: Dashboard de análise logística no Power BI
    problema: consultas lentas numa base logística de 2,1 milhões de registros.
    solucao: particionamento das tabelas por data no PostgreSQL e KPIs operacionais no Power BI.
    resultado: a consulta caiu de 551 ms para 0,034 ms.
  en:
    titulo: "LogiTrack: SQL Analytics"
    alt: Logistics analysis dashboard in Power BI
    problema: slow queries on a logistics database with 2.1 million records.
    solucao: date-based table partitioning in PostgreSQL and operational KPIs in Power BI.
    resultado: query time dropped from 551 ms to 0.034 ms.

