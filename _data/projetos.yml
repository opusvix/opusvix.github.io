# A ordem na página segue a ordem deste arquivo.
- slug: inbody
  destaque: true
  imagem: /assets/projetos/inbody/capa.webp
  tags: [JavaScript, Análise temporal, Saúde]
  tags_en: [JavaScript, Time series, Health]
  links:
    estudo: /projetos/inbody.html
    estudo_en: /en/projetos/inbody.html
    app: https://opusvix.github.io/inbody/
    github: https://github.com/opusvix/inbody
  pt:
    titulo: "InBody: composição corporal"
    alt: Painel do app InBody com peso, gordura, massa muscular e gordura visceral
    problema: cada laudo de bioimpedância mostra só um momento; com os PDFs espalhados, a tendência fica invisível.
    solucao: app que transforma os laudos InBody120 em série histórica, com leitura automática contra as faixas de referência e exportação em CSV e JSON.
    resultado: em 4 exames, −8,4 kg de peso e −5,2 kg de gordura, com IMC de 26,4 para 23,6, e o alerta de queda de massa muscular que um laudo isolado não mostra.
  en:
    titulo: "InBody: body composition"
    alt: InBody app dashboard with weight, fat, muscle mass and visceral fat
    problema: each bioimpedance report shows a single moment; with PDFs scattered around, the trend is invisible.
    solucao: an app that turns InBody120 reports into a time series, with automatic reading against reference ranges and CSV/JSON export.
    resultado: across 4 exams, −8.4 kg of weight and −5.2 kg of fat, BMI from 26.4 to 23.6, plus the muscle-loss alert a single report hides.

- slug: controle-financeiro
  destaque: true
  imagem: /assets/projetos/controle-financeiro/dashboard.webp
  tags: [Python, FastAPI, SQLite, React]
  links:
    estudo: /projetos/controle-financeiro.html
    estudo_en: /en/projetos/controle-financeiro.html
    github: https://github.com/opusvix/controle-financeiro
  pt:
    titulo: Controle Financeiro
    alt: Painel do Controle Financeiro com saldos e gastos por categoria
    problema: contas, cartões e compras de mercado da família espalhados, sem visão do todo.
    solucao: app desktop que consolida contas e faturas e lê cupons fiscais (NFC-e) item a item, com controle de preços.
    resultado: cada indicador tem fórmula documentada num dicionário de métricas e é conferido por 140 testes automáticos.
  en:
    titulo: Personal Finance Control
    alt: Personal Finance Control dashboard with balances and spending by category
    problema: the family's accounts, credit cards and grocery purchases were scattered, with no overall view.
    solucao: a desktop app that consolidates accounts and card bills and reads Brazilian e-receipts (NFC-e) line by line, with price tracking.
    resultado: every metric has a documented formula in a metrics dictionary and is checked by 140 automated tests.

- slug: glicemia-app
  destaque: true
  imagem: /assets/projetos/glicemia-app/capa.webp
  tags: [JavaScript, PWA, Análise temporal]
  tags_en: [JavaScript, PWA, Time series]
  links:
    estudo: /projetos/glicemia-app.html
    estudo_en: /en/projetos/glicemia-app.html
    app: https://opusvix.github.io/glicemia/
    github: https://github.com/opusvix/glicemia
  pt:
    titulo: "Glicemia: app de monitoramento"
    alt: Painel do app Glicemia com média, maior e menor valor e dias na faixa normal
    problema: medições diárias anotadas em planilha, sem análise no dia a dia.
    solucao: app instalável no celular (PWA) que registra a medição e calcula os indicadores na hora, com os dados só no aparelho.
    resultado: média móvel de 7, 14 ou 30 dias, % de dias na faixa normal e comparação fim de semana × dias úteis a cada registro.
  en:
    titulo: "Blood Glucose: monitoring app"
    alt: Blood glucose app dashboard with average, highest and lowest value and days in the normal range
    problema: daily readings were logged in a spreadsheet, with no day-to-day analysis.
    solucao: an installable mobile app (PWA) that records each reading and computes the metrics instantly, keeping data on the device.
    resultado: 7, 14 or 30-day moving average, % of days in the normal range and weekend vs weekday comparison on every entry.

- slug: controle-de-veiculos
  destaque: true
  imagem: /assets/projetos/controle-de-veiculos/relatorios.webp
  tags: [Python, Tkinter, Indicadores]
  tags_en: [Python, Tkinter, KPIs]
