  pt:
    titulo: Controle de Veículos
    alt: Tela de relatórios do Controle de Veículos com indicadores e gráfico
    problema: o custo real do carro fica espalhado entre notas de posto e oficina.
    solucao: app Windows com versão para celular e sincronização pelo Wi-Fi, para abastecimentos, manutenções e lembretes de revisão.
    resultado: 12 indicadores por período e veículo, incluindo km/L e R$/km de cada abastecimento.
  en:
    titulo: Vehicle Cost Tracker
    alt: Vehicle Cost Tracker reports screen with metrics and chart
    problema: the true cost of a car is spread across fuel and repair receipts.
    solucao: a Windows app with a mobile version synced over Wi-Fi, for fuel-ups, maintenance and service reminders.
    resultado: 12 metrics by period and vehicle, including km/L and cost per km for every fuel-up.

- slug: porsche
  destaque: true
  imagem: /assets/projetos/porsche/capa.webp
  tags: [JavaScript, Chart.js, Qualidade de dados]
  tags_en: [JavaScript, Chart.js, Data quality]
  links:
    dashboard: https://opusvix.github.io/dashboard_porsche_sales/
    github: https://github.com/opusvix/dashboard_porsche_sales
  pt:
    titulo: Porsche Enterprise Sales Intelligence
    alt: Capa do dashboard Enterprise Sales Intelligence
    problema: a diretoria precisa comparar vendas entre períodos e chegar até a transação.
    solucao: dashboard executivo com KPIs, comparação temporal, drill-through e detalhamento transacional.
    resultado: tratamento de qualidade que separa os 76 de 100 registros com data válida, para que a evolução mensal não seja distorcida.
    nota: Projeto de bootcamp com base simulada (100 vendas fictícias), sem afiliação com a Porsche.
  en:
    titulo: Porsche Enterprise Sales Intelligence
    alt: Enterprise Sales Intelligence dashboard cover
    problema: leadership needs to compare sales across periods and drill down to the transaction.
    solucao: an executive dashboard with KPIs, period comparison, drill-through and transaction detail.
    resultado: a data-quality step isolates the 76 of 100 records with a valid date, so the monthly trend is not distorted.
    nota: Bootcamp project built on a simulated dataset (100 fictitious sales), not affiliated with Porsche.

