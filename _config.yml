title: Maurício Barros
description: Analista de Dados · SQL, Power BI, Python, BigQuery e Microsoft Fabric
url: https://opusvix.github.io
lang: pt-BR
locale: pt_BR
author: Maurício Barros
image: /assets/img/og-image.png
logo: /assets/img/favicon-512.png

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Ferramentas do filtro de projetos (precisam existir em "tags" no _data/projetos.yml)
filtros: [Power BI, SQL, Python, JavaScript]

# Contador de visitas GoatCounter: preencha com o código da sua conta
# (ex.: "mauriciobarros" para mauriciobarros.goatcounter.com). Vazio = desligado.
goatcounter: ""

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: pt-BR

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - public
  - _config_gitlab.yml
