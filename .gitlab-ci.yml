image: ruby:3.2

pages:
  cache:
    key:
      files:
        - Gemfile
  script:
    - gem install bundler
    - bundle config set path vendor/bundle
    - bundle install --jobs 4
    - bundle exec jekyll build --config _config.yml,_config_gitlab.yml -s . -d public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
